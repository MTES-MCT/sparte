server {
    listen 6000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;

    location = / {
        return 302 /aide/;
    }

    location = /aide {
        return 301 /aide/;
    }

    location /aide/ {
        try_files $uri $uri/ =404;
    }

    error_page 404 /aide/404.html;
}