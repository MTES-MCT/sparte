name: 'Pull Request'

on:
  push:
    branches-ignore:
      - 'staging'
      - 'master'

env:
  ENVIRONMENT: local
  SECRET: ${{ secrets.SECRET }}
  DEBUG: 0
  ALLOWED_HOSTS: 127.0.0.1,localhost
  DOMAIN_URL: http://localhost:8080/
  EMAIL_ENGINE: local
  EMAIL_FILE_PATH: ${GITHUB_WORKSPACE}/emails
  POSTGRES_DB: postgres
  CELERY_BROKER_URL: null
  CELERY_RESULT_BACKEND: null
  CELERY_TASK_ALWAYS_EAGER: null
  API_KEY_SENDINBLUE: null
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_LOCATION: ${{ secrets.AWS_LOCATION }}
  AWS_S3_REGION_NAME: ${{ secrets.AWS_S3_REGION_NAME }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_STORAGE_BUCKET_NAME: ${{ secrets.AWS_STORAGE_BUCKET_NAME }}
  CRISP_WEBHOOK_SECRET_KEY: ${{ secrets.CRISP_WEBHOOK_SECRET_KEY }}
  CRISP_WEBSITE_ID: ${{ secrets.CRISP_WEBSITE_ID }}
  AWS_S3_ENDPOINT_URL: ${{ secrets.AWS_S3_ENDPOINT_URL }}
  PROCONNECT_DOMAIN: null
  PROCONNECT_CLIENT_ID: null
  PROCONNECT_SECRET: null

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pre-commit/action@v3.0.1
        env:
          SKIP: ggshield,sqlfluff-lint,sqlfluff-fix,tsc  # tsc tourne dans test-frontend, avec node_modules

  test-frontend:
    name: Frontend Tests (Jest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Vérification TypeScript
        run: npm run tsc -- --noEmit -p .
      - name: Run frontend tests
        run: npm test -- --coverage
      - name: Upload coverage reports
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        if: always()
        with:
          files: ./coverage/lcov.info
          flags: frontend
          name: frontend-coverage
        continue-on-error: true

  test-backend:
    name: Backend Tests (Django)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: 'pipenv'
      - name: Install pipenv
        run: curl https://raw.githubusercontent.com/pypa/pipenv/master/get-pipenv.py | python
      - name: Install Python dependencies
        run: pipenv install --dev
      - name: Install GDAL
        run: |
          sudo apt-get update
          sudo apt-get install -y gdal-bin libgdal-dev
      - name: Install Node dependencies (for webpack build)
        run: npm install
      - name: Build frontend assets
        run: npm run build
      - name: Run backend tests
        run: pipenv run python -Wa manage.py test
        env:
          DATABASE_URL: postgres://postgres@localhost:5432/postgres
