name: 'Pull Request'

on:
  push:
    branches-ignore:
      - 'staging'
      - 'master'

permissions:
  contents: read

env:
  ENVIRONMENT: local
  SECRET: ${{ secrets.SECRET }}
  DEBUG: 0
  ALLOWED_HOSTS: 127.0.0.1,localhost
  DOMAIN_URL: http://localhost:8080/
  EMAIL_ENGINE: local
  EMAIL_FILE_PATH: ${GITHUB_WORKSPACE}/emails
  POSTGRES_DB: postgres
  CELERY_BROKER_URL: null
  CELERY_RESULT_BACKEND: null
  CELERY_TASK_ALWAYS_EAGER: null
  API_KEY_SENDINBLUE: null
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_LOCATION: ${{ secrets.AWS_LOCATION }}
  AWS_S3_REGION_NAME: ${{ secrets.AWS_S3_REGION_NAME }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_STORAGE_BUCKET_NAME: ${{ secrets.AWS_STORAGE_BUCKET_NAME }}
  CRISP_WEBHOOK_SECRET_KEY: ${{ secrets.CRISP_WEBHOOK_SECRET_KEY }}
  CRISP_WEBSITE_ID: ${{ secrets.CRISP_WEBSITE_ID }}
  AWS_S3_ENDPOINT_URL: ${{ secrets.AWS_S3_ENDPOINT_URL }}
  PROCONNECT_DOMAIN: null
  PROCONNECT_CLIENT_ID: null
  PROCONNECT_SECRET: null

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pre-commit/action@v3.0.1
        env:
          SKIP: ggshield,sqlfluff-lint,sqlfluff-fix,tsc  # tsc tourne dans test-frontend, avec node_modules

  test-frontend:
    name: Frontend Tests (Jest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Vérification TypeScript
        run: npm run tsc -- --noEmit -p .
      - name: Run frontend tests
        run: npm test -- --coverage
      - name: Upload coverage reports
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        if: always()
        with:
          files: ./coverage/lcov.info
          flags: frontend
          name: frontend-coverage
        continue-on-error: true

  test-backend:
    name: Backend Tests (Django)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: 'pipenv'
      - name: Install pipenv
        run: curl https://raw.githubusercontent.com/pypa/pipenv/master/get-pipenv.py | python
      - name: Install Python dependencies
        run: pipenv install --dev
      - name: Install GDAL
        run: |
          sudo apt-get update
          sudo apt-get install -y gdal-bin libgdal-dev
      - name: Install Node dependencies (for webpack build)
        run: npm install
      - name: Build frontend assets
        run: npm run build
      - name: Run backend tests
        run: pipenv run python -Wa manage.py test
        env:
          DATABASE_URL: postgres://postgres@localhost:5432/postgres

  test-e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Pile complète en local sur le runner : Django (8080), serveur d'export
      # Puppeteer (3001) et bucket S3 factice versitygw (7070), comme docker-compose.
      DATABASE_URL: postgres://postgres@localhost:5432/postgres
      USE_CSP: 0
      USE_SRI: 0
      EXPORT_SERVER_URL: http://localhost:3001
      EXPORT_BASE_URL: http://localhost:8080
      AWS_S3_ENDPOINT_URL: http://localhost:7070
      AWS_S3_REGION_NAME: us-east-1
      AWS_ACCESS_KEY_ID: localaccess
      AWS_SECRET_ACCESS_KEY: localsecret
      AWS_STORAGE_BUCKET_NAME: sparte-local
      AWS_LOCATION: local
      E2E_BASE_URL: http://localhost:8080
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: 'pipenv'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            export/package-lock.json
      - name: Install pipenv
        run: pip install pipenv==2026.10.5
      - name: Install Python dependencies (from Pipfile.lock)
        run: pipenv sync --dev
      - name: Install GDAL
        run: |
          sudo apt-get update
          sudo apt-get install -y gdal-bin libgdal-dev
      - name: Install Node dependencies
        run: npm ci --ignore-scripts
      - name: Install Playwright browser and system libraries
        run: ./node_modules/.bin/playwright install --with-deps chromium
      - name: Build frontend assets
        run: npm run build
      - name: Install and build export server
        # Les scripts d'installation sont désactivés : le Chrome de Puppeteer
        # est téléchargé explicitement juste après.
        run: |
          npm ci --ignore-scripts
          ./node_modules/.bin/puppeteer browsers install chrome
          npm run build
        working-directory: export
      - name: Start local S3 bucket (versitygw)
        run: |
          mkdir -p "$RUNNER_TEMP/s3/sparte-local"
          docker run -d --name s3 -p 7070:7070 \
            -e ROOT_ACCESS_KEY=localaccess -e ROOT_SECRET_KEY=localsecret \
            -v "$RUNNER_TEMP/s3:/data" versity/versitygw:latest posix /data
      - name: Prepare database (migrations + fixture d'un territoire)
        run: |
          pipenv run python manage.py migrate --noinput
          pipenv run python manage.py e2e_setup_db
      - name: Start export server
        run: |
          PORT=3001 ALLOWED_HOSTS=localhost nohup node dist/api.js > "$RUNNER_TEMP/export-server.log" 2>&1 &
        working-directory: export
      - name: Start Django
        run: |
          nohup pipenv run python manage.py runserver 0.0.0.0:8080 --insecure --noreload > "$RUNNER_TEMP/django.log" 2>&1 &
      - name: Wait for services
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/ > /dev/null && curl -fsS http://localhost:3001/health > /dev/null; then
              echo "Services prêts"
              exit 0
            fi
            sleep 2
          done
          echo "Les services n'ont pas démarré à temps"
          cat "$RUNNER_TEMP/django.log" "$RUNNER_TEMP/export-server.log" || true
          exit 1
      - name: Run e2e tests
        run: npm run test:e2e
      - name: Show server logs
        if: failure()
        run: |
          for log in django export-server; do
            echo "::group::$log"
            cat "$RUNNER_TEMP/$log.log" 2>/dev/null || echo "(pas de log : le serveur n'a pas été lancé)"
            echo "::endgroup::"
          done
      - name: Upload Playwright report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
