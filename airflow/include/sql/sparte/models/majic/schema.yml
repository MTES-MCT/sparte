
version: 2

models:
  - name: consommation
    columns:
    - name: commune_code
      data_tests:
      - not_null
      - unique
  - name: period_consommation_departement
    columns:
    - name: departement
      data_tests:
      - not_null
      - has_all_departements:
          severity: warn
      - relationships:
          to: ref('departement')
          field: code
  - name: period_consommation_epci
    columns:
    - name: epci
      data_tests:
      - not_null
      - has_all_epcis:
          severity: warn
      - relationships:
          to: ref('epci')
          field: code
  - name: period_consommation_region
    columns:
    - name: region
      data_tests:
      - not_null
      - has_all_regions:
          severity: warn
      - relationships:
          to: ref('region')
          field: code
  - name: period_consommation_scot
    columns:
    - name: scot
      data_tests:
      - not_null
      - has_all_scots
      - relationships:
          to: ref('scot')
          field: id_scot
sources:
  - name: public
    tables:
    - name: majic_france_metropolitaine_2024
    - name: majic_guadeloupe_2024
    - name: majic_guyane_2024
    - name: majic_martinique_2024
    - name: majic_la_reunion_2024
    - name: majic_france_metropolitaine_2025
    - name: majic_guadeloupe_2025
    - name: majic_guyane_2025
    - name: majic_martinique_2025
    - name: majic_la_reunion_2025
    - name: majic_carroyage_lea
