version: 2

models:
  - name: scot_communes
    columns:
    - name: commune_code
      data_tests:
      - not_null
      - unique
    - name: id_scot
      data_tests:
      - not_null
      - relationships:
          to: ref('scot')
          field: id_scot
    - name: approved
      description: "Statut du SCoT de rattachement (cf. gpu_scot) : true = opposable, false = en projet"
      data_tests:
      - not_null
