# Surcharge du compose généré par le CLI Astro (appliquée par `astro dev start` / `restart`).
#
# Pour un projet Airflow 3, le CLI impose le SimpleAuthManager avec
# `SIMPLE_AUTH_MANAGER_ALL_ADMINS=True` (tout visiteur est admin, sans mot de
# passe) et une URL publique http://localhost:8080, par-dessus le `.env`.
# On rétablit ici l'authentification Flask-AppBuilder (OAuth GitHub, voir
# webserver_config.py) et l'URL publique, lue dans le `.env`.
x-auth-env: &auth-env
  AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
  AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "False"
  AIRFLOW__API__BASE_URL: ${AIRFLOW__API__BASE_URL:-http://localhost:9090}

services:
  api-server:
    environment: *auth-env
  scheduler:
    environment: *auth-env
  dag-processor:
    environment: *auth-env
  triggerer:
    environment: *auth-env
  db-migration:
    environment: *auth-env
